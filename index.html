<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4b3621" />
    <meta name="application-name" content="Hotel Yuvaan Backoffice" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('hotel-yuvaan-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldUseDark = theme ? theme === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', shouldUseDark);
        } catch (error) {}
      })();
    </script>
    <title>Hotel Yuvaan | Admin Backoffice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
